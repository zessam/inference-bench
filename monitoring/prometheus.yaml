# prometheus.yaml
# VLLM_METRICS_TARGET and VLLM_METRICS_SCHEME are filled in from .env when
# the container starts.
global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: vllm
    scheme: ${VLLM_METRICS_SCHEME}
    static_configs:
      - targets:
          - '${VLLM_METRICS_TARGET}'
